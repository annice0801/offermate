<!--
  OfferMate favicon（對應 components/logo.tsx 的品牌圖示）
  - 左下角是尖角的圓角方塊 = 對話框，代表「面試對談」
  - 中間的漸層圓點 = 錄音中 / AI 面試官在線（圓點放大、對話框撐滿畫布，16px 分頁上也醒目）
  - 淺色模式：深海軍藍對話框；深色模式：霧白對話框（與頁尾反白 Logo 相同），在深色分頁列上也清楚
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="1" stop-color="#0e2233"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2cc7c0"/>
      <stop offset="1" stop-color="#3f7fd6"/>
    </linearGradient>
    <style>
      .bubble { fill: url(#bubble); }
      @media (prefers-color-scheme: dark) {
        .bubble { fill: #edf3f7; }
      }
    </style>
  </defs>
  <path class="bubble" d="M18 2H46A16 16 0 0 1 62 18V46A16 16 0 0 1 46 62H7A5 5 0 0 1 2 57V18A16 16 0 0 1 18 2Z"/>
  <circle cx="32" cy="32" r="13" fill="url(#dot)"/>
</svg>
